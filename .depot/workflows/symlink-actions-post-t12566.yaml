name: Symlinked actions dir post step repro (T-12566)

on:
  workflow_dispatch:

jobs:
  control:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e
        with:
          run: echo REPRO-MAIN case=control
          post: echo REPRO-POST case=control

  symlinked-local-composite:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/post-composite-t12566
        with:
          case: symlinked-local-composite
