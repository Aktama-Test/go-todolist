name: Patched CodSpeed on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

permissions:
  contents: read
  id-token: write

jobs:
  codspeed-preinstall-patched:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - name: Pre-install valgrind-codspeed
        run: |
          curl -fsSL -o /tmp/valgrind-codspeed.deb https://github.com/CodSpeedHQ/valgrind-codspeed/releases/download/3.26.0-0codspeed10/valgrind_3.26.0-0codspeed10_ubuntu-24.04_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/valgrind-codspeed.deb libc6-dbg
          valgrind --version
      - uses: ./.depot/actions/codspeed-patched-t13126
        with:
          mode: simulation
          run: pytest bench-t13126 --codspeed
