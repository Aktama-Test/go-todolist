name: Patched CodSpeed without Tailscale repro (T-13126)

on:
  push:
    branches: [t13126-push]

permissions:
  contents: read
  id-token: write

jobs:
  codspeed-patched-no-tailscale:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - name: Stop Tailscale and reset DNS
        run: |
          sed 's/^/REPRO before resolv.conf /' /etc/resolv.conf
          sudo pkill -f tailscaled || echo "REPRO no tailscaled running"
          sleep 2
          printf 'nameserver 8.8.8.8\nnameserver 9.9.9.9\n' | sudo tee /etc/resolv.conf >/dev/null
          sed 's/^/REPRO after resolv.conf /' /etc/resolv.conf
          pgrep -a tailscaled | sed 's/^/REPRO still running /' || echo "REPRO tailscaled stopped"
      - uses: ./.depot/actions/codspeed-patched-t13126
        with:
          mode: simulation
          run: pytest bench-t13126 --codspeed
      - name: DNS after CodSpeed
        if: always()
        run: sed 's/^/REPRO end resolv.conf /' /etc/resolv.conf
