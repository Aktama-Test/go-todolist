name: reqwest musl probe on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

jobs:
  reqwest-probe:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolver config
        run: |
          sed 's/^/REPRO resolv.conf /' /etc/resolv.conf
          grep hosts /etc/nsswitch.conf | sed 's/^/REPRO nsswitch /'
          ls -la /etc/resolv.conf | sed 's/^/REPRO /'
          for ns in 8.8.8.8 9.9.9.9 100.100.100.100; do
            if timeout 5 bash -c "exec 3<>/dev/udp/$ns/53" 2>/dev/null; then :; fi
            r=$(dig +time=3 +tries=1 @$ns github.com A +short 2>&1 | head -1)
            echo "REPRO dig @$ns -> ${r:-<empty>}"
          done
      - name: Build probes
        working-directory: reqwest-probe-t13126
        run: |
          command -v musl-gcc || sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -q
          cargo build --release -q --target x86_64-unknown-linux-musl
      - name: Run probes
        working-directory: reqwest-probe-t13126
        run: |
          URL=https://api.codspeed.io/upload
          echo "REPRO --- glibc"
          ./target/release/reqwest-probe $URL
          echo "REPRO --- musl"
          ./target/x86_64-unknown-linux-musl/release/reqwest-probe $URL
          echo "REPRO --- musl strace"
          command -v strace || sudo apt-get install -y -qq strace
          strace -f -e trace=connect,sendto,recvfrom -s 64 ./target/x86_64-unknown-linux-musl/release/reqwest-probe $URL 2>&1 | grep -E "connect|sendto|recvfrom" | head -20 | sed 's/^/REPRO strace /'
