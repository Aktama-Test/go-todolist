name: Patched CodSpeed on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

jobs:
  codspeed-patched-local:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.depot/actions/codspeed-patched-t13126
        with:
          mode: simulation
          run: echo REPRO case=codspeed-patched-local-push-sim step=benchmark
        env:
          CODSPEED_LOG: trace

  tls-probe:
    runs-on: depot-ubuntu-latest
    steps:
      - shell: bash
        run: |
          for h in github.com release-assets.githubusercontent.com; do
            echo "REPRO host=$h"
            echo | openssl s_client -connect $h:443 -servername $h -showcerts 2>/dev/null | grep -E "^ *[0-9] s:|^ *i:" | sed 's/^/REPRO   /'
          done
          env | grep -i -E "ssl|cert|^ca_|curl_ca" | sed 's/^/REPRO env /' || echo "REPRO no ssl/cert env"
          ls -la /usr/local/share/ca-certificates/ 2>&1 | sed 's/^/REPRO ca-dir /'
          ls -la /etc/ssl/certs/ca-certificates.crt | sed 's/^/REPRO bundle /'
          cat /etc/resolv.conf | sed 's/^/REPRO resolv /'
          getent ahosts github.com | head -4 | sed 's/^/REPRO getent /'
