name: reqwest probe on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

jobs:
  reqwest-probe:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build probe
        working-directory: reqwest-probe-t13126
        run: |
          cargo --version || { curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal; . "$HOME/.cargo/env"; }
          cargo build --release -q
      - name: Run probe
        working-directory: reqwest-probe-t13126
        run: |
          URLS="https://github.com/CodSpeedHQ/valgrind-codspeed/releases/download/3.26.0-0codspeed10/valgrind_3.26.0-0codspeed10_ubuntu-24.04_amd64.deb https://api.codspeed.io/upload https://gql.codspeed.io/ https://example.com/"
          ./target/release/reqwest-probe $URLS
          for u in $URLS; do curl -sS -o /dev/null -w "REPRO curl url=$u http=%{http_code} ip=%{remote_ip}\n" --max-time 30 "$u" || echo "REPRO curl url=$u failed"; done
      - name: Run probe under strace
        working-directory: reqwest-probe-t13126
        run: |
          command -v strace || sudo apt-get install -y -qq strace
          strace -f -e trace=network,connect -s 128 ./target/release/reqwest-probe https://api.codspeed.io/upload 2>&1 | tail -60 | sed 's/^/REPRO strace /'
