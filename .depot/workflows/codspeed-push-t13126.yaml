name: CodSpeed runner strace on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

permissions:
  contents: read
  id-token: write

jobs:
  codspeed-plain-step:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - name: Install CodSpeed runner 5.6.0
        run: |
          curl -fsSL https://codspeed.io/v5.6.0/install.sh | bash -s -- --quiet
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: codspeed run under strace
        env:
          CODSPEED_LOG: debug
        run: |
          command -v strace || sudo apt-get install -y -qq strace
          which codspeed
          strace -f -o /tmp/codspeed.strace codspeed run --mode simulation -- pytest bench-t13126 --codspeed 2>&1 | tail -30 | sed 's/^/REPRO out /' || true
          echo "REPRO --- failing network syscalls"
          grep -E "connect\(|sendto\(|socket\(" /tmp/codspeed.strace | grep -v -E "= 0$|EINPROGRESS|ENOENT" | head -30 | sed 's/^/REPRO strace /'
          echo "REPRO --- DNS and 443 connects"
          grep -E "htons\(53\)|htons\(443\)" /tmp/codspeed.strace | head -30 | sed 's/^/REPRO strace /'
