name: CodSpeed runner strace on push repro (T-13126)

on:
  push:
    branches: [t13126-push]

permissions:
  contents: read
  id-token: write

jobs:
  codspeed-plain-step:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - name: Install CodSpeed runner 5.6.0
        run: |
          curl -fsSL https://codspeed.io/v5.6.0/install.sh | bash -s -- --quiet
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: codspeed run under strace
        env:
          CODSPEED_LOG: debug
        run: |
          command -v strace || sudo apt-get install -y -qq strace
          which codspeed
          strace -f -e trace=network,poll,ppoll,epoll_wait,close -o /tmp/codspeed.strace timeout 60 codspeed run --mode simulation -- pytest bench-t13126 --codspeed > /dev/null 2>&1 || true
          echo "REPRO --- first DNS socket lifecycle"
          fd=$(grep -m1 -E "socket\(AF_INET, SOCK_DGRAM" /tmp/codspeed.strace | sed -E 's/.*= ([0-9]+)$/\1/')
          pid=$(grep -m1 -E "socket\(AF_INET, SOCK_DGRAM" /tmp/codspeed.strace | awk '{print $1}')
          echo "REPRO fd=$fd pid=$pid"
          awk -v p="$pid" '$1==p' /tmp/codspeed.strace | grep -n -A25 -m1 "socket(AF_INET, SOCK_DGRAM" | head -40 | sed 's/^/REPRO strace /'
          echo "REPRO --- any sends to port 53"
          grep -E "htons\(53\)" /tmp/codspeed.strace | head -5 | sed 's/^/REPRO strace /'
          sed 's/^/REPRO hosts /' /etc/hosts
