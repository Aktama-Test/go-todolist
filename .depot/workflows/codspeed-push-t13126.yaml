name: CodSpeed CLI without action repro (T-13126)

on:
  push:
    branches: [t13126-push]

permissions:
  contents: read
  id-token: write

jobs:
  codspeed-cli-no-tailscale:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - name: Stop Tailscale and reset DNS
        run: |
          sudo pkill -f tailscaled || true
          sleep 2
          printf 'nameserver 8.8.8.8\nnameserver 9.9.9.9\n' | sudo tee /etc/resolv.conf >/dev/null
          sed 's/^/REPRO resolv.conf /' /etc/resolv.conf
      - name: Run CodSpeed CLI directly
        run: |
          curl -fsSL https://codspeed.io/v5.6.0/install.sh | bash -s -- --quiet
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "REPRO codspeed=$(command -v codspeed)"
          codspeed run --mode simulation -- pytest bench-t13126 --codspeed
