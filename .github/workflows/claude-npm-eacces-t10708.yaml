name: claude-code npm EACCES repro (T-10708)
on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        runner: [depot-ubuntu-24.04, depot-ubuntu-22.04, ubuntu-latest]
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Environment
        run: |
          id
          echo "npm:        $(command -v npm) $(npm --version)"
          echo "npm root -g:$(npm root -g)"
          echo "claude:     $(command -v claude || echo NONE)"
          echo "--- global node_modules ---"
          ls -ld "$(npm root -g)"
          ls -ld "$(npm root -g)/@anthropic-ai" 2>/dev/null || echo "no @anthropic-ai dir"
          ls -la "$(npm root -g)/@anthropic-ai" 2>/dev/null || true
          echo "--- claude binary ---"
          ls -l /usr/local/bin/claude 2>/dev/null || echo "no /usr/local/bin/claude"
          readlink -f /usr/local/bin/claude 2>/dev/null || true

      - name: Repro - unguarded npm install -g @anthropic-ai/claude-code
        id: repro
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Control - unguarded npm install -g of an unrelated scoped pkg
        id: control_scoped
        continue-on-error: true
        run: npm install -g @sindresorhus/is

      - name: Control - unguarded npm install -g of an unscoped pkg
        id: control_unscoped
        continue-on-error: true
        run: npm install -g is-odd

      - name: Workaround A - native installer (no root)
        id: native
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Workaround B - sudo npm install -g
        id: sudonpm
        continue-on-error: true
        run: |
          sudo npm install -g @anthropic-ai/claude-code
          /usr/local/bin/claude --version

      - name: Summary
        if: always()
        run: |
          echo "runner:                     ${{ matrix.runner }}"
          echo "repro   claude-code:        ${{ steps.repro.outcome }}"
          echo "control scoped pkg:         ${{ steps.control_scoped.outcome }}"
          echo "control unscoped pkg:       ${{ steps.control_unscoped.outcome }}"
          echo "workaround A native:        ${{ steps.native.outcome }}"
          echo "workaround B sudo npm -g:   ${{ steps.sudonpm.outcome }}"
