name: claude-code npm EACCES repro (T-10708)
on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        runner: [depot-ubuntu-24.04, depot-ubuntu-22.04, ubuntu-latest]
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Simulate agentd removeClaudeCode (what Tractian's org gets)
        run: |
          echo "--- before ---"
          ls -ld /usr/local/lib/node_modules/@anthropic-ai 2>/dev/null || echo "no @anthropic-ai dir"
          ls -l /usr/local/bin/claude 2>/dev/null || echo "no /usr/local/bin/claude"
          echo "--- running agentd's exact removal sequence as root ---"
          sudo npm uninstall --global @anthropic-ai/claude-code || true
          sudo rm -f /usr/local/bin/claude
          echo "--- after ---"
          ls -ld /usr/local/lib/node_modules/@anthropic-ai 2>/dev/null || echo "no @anthropic-ai dir (cleaned up)"
          ls -la /usr/local/lib/node_modules/@anthropic-ai 2>/dev/null || true
          echo "claude on PATH: $(command -v claude || echo NONE)"

      - name: Repro (customer snippet, verbatim)
        id: repro
        continue-on-error: true
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "claude already on PATH: $(command -v claude)"
            claude --version
            echo "Skipping npm install"
          else
            echo "claude not found on PATH; installing @anthropic-ai/claude-code"
            npm install -g @anthropic-ai/claude-code
            claude --version
          fi

      - name: Workaround A - native installer (no root)
        id: native
        continue-on-error: true
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Summary
        if: always()
        run: |
          echo "runner:                ${{ matrix.runner }}"
          echo "repro after removal:   ${{ steps.repro.outcome }}"
          echo "workaround A native:   ${{ steps.native.outcome }}"
