name: claude-code npm EACCES repro (T-10708)
on:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [depot-ubuntu-24.04, depot-ubuntu-22.04]
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: agentd version and scope dir permissions
        run: |
          /usr/local/bin/agentd --version 2>/dev/null || echo "agentd --version unavailable"
          echo "--- scope dir (want 0777 after the fix, was 0755) ---"
          ls -ld /usr/local/lib/node_modules /usr/local/lib/node_modules/@anthropic-ai 2>&1
          echo "claude on PATH: $(command -v claude || echo NONE)"

      - name: Variant 1 - unguarded install over the preinstalled copy (was EACCES rename)
        id: rename_variant
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: Simulate the removeClaudeCode state, then retry (was EACCES mkdir)
        id: mkdir_variant
        continue-on-error: true
        run: |
          sudo npm uninstall --global @anthropic-ai/claude-code || true
          sudo rm -f /usr/local/bin/claude
          echo "--- leftover scope dir ---"
          ls -ld /usr/local/lib/node_modules/@anthropic-ai 2>&1 || echo "removed"
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Summary
        if: always()
        run: |
          echo "runner:                 ${{ matrix.runner }}"
          echo "variant 1 (rename):     ${{ steps.rename_variant.outcome }}"
          echo "variant 2 (mkdir):      ${{ steps.mkdir_variant.outcome }}"
