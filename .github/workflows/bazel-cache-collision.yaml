name: Bazel Cache Collision Repro

# depot-runner: the shadowing test (invalid command-line token still hits the
#   cache when auto-connect is on, because Depot's injected per-runner token
#   sorts first).
# github-hosted: ubuntu-latest has no Depot injection, so this runs Bryce's
#   exact setup (manual .bazelrc + repo-contents cache + valid org token on the
#   command line) to see whether it fails on the GitHub-hosted path too.

on:
  workflow_dispatch: {}
  push:
    branches:
      - test/bazel-cache-collision

jobs:
  depot-runner:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    env:
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Show merged config + header order
        run: |
          set +e
          echo "::group::Depot-injected HOME/.bazelrc"
          [ -f "$HOME/.bazelrc" ] && sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' "$HOME/.bazelrc" || echo "(none - auto-connect off)"
          echo "::endgroup::"
          command -v bazel >/dev/null 2>&1 || sudo npm install -g @bazel/bazelisk >/dev/null 2>&1
          bazel version 2>&1 | head -1
      - name: Build with INVALID command-line token (shadowing test)
        run: |
          set +e
          bazel clean >/dev/null 2>&1
          bazel build //:hello \
            --remote_header=authorization=depot_org_INVALIDPLACEHOLDER000 \
            --remote_upload_local_results=true \
            --remote_timeout=20s \
            --disk_cache= 2>&1 | tee build-invalid.log | tail -25
          echo "----- auth/cache signal (INVALID token) -----"
          grep -iE "UNAUTHENTICATED|invalid token|remote cache hit|uploaded|processes:" build-invalid.log \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' || echo "(none found)"

  github-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no Depot injection
        run: |
          set +e
          [ -f "$HOME/.bazelrc" ] && cat "$HOME/.bazelrc" || echo "(no ~/.bazelrc - expected on GitHub-hosted)"
          echo "DEPOT_CACHE_HOST=${DEPOT_CACHE_HOST:-<unset>}"
          command -v bazel >/dev/null 2>&1 || sudo npm install -g @bazel/bazelisk >/dev/null 2>&1
          bazel version 2>&1 | head -1
      - name: Build with VALID org token (action cache + repo-contents cache)
        run: |
          set +e
          bazel clean --expunge >/dev/null 2>&1
          bazel build //:hello \
            --remote_header=authorization=$DEPOT_TOKEN \
            --remote_upload_local_results=true \
            --remote_timeout=30s \
            --disk_cache= \
            --repository_cache= 2>&1 | tee gh.log | tail -50
          echo "----- signals (VALID org token, GitHub-hosted) -----"
          grep -iE "UNAUTHENTICATED|invalid token|repo contents|Remote repo|Inconsistent filesystem|remote cache hit|uploaded|processes:|Fetching|skylib" gh.log \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' | head -40
      - name: Second build (warm repo-contents cache)
        run: |
          set +e
          bazel clean --expunge >/dev/null 2>&1
          bazel build //:hello \
            --remote_header=authorization=$DEPOT_TOKEN \
            --remote_timeout=30s \
            --disk_cache= \
            --repository_cache= 2>&1 | tee gh2.log | tail -30
          echo "----- signals (warm) -----"
          grep -iE "UNAUTHENTICATED|invalid token|repo contents|Remote repo|Inconsistent filesystem|remote cache hit|processes:" gh2.log \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' | head -30
