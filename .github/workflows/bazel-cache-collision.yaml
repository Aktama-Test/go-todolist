name: Bazel Cache Collision Repro

# Stage 2: inject the auth header on the command line (mimicking the customer's
# bazelisk wrapper) and actually build. The key step builds with a deliberately
# INVALID command-line token:
#   - auto-connect ON  -> Depot's injected per-runner token sorts first, shadows
#                         ours, so the build authenticates anyway.
#   - auto-connect OFF -> only our (invalid) token is sent, so it fails.
# Same invalid token, opposite outcome, toggled only by the org setting.

on:
  workflow_dispatch: {}
  push:
    branches:
      - test/bazel-cache-collision

jobs:
  depot-runner:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 12
    env:
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Show merged config + header order
        run: |
          set +e
          echo "::group::Depot-injected HOME/.bazelrc"
          [ -f "$HOME/.bazelrc" ] && sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' "$HOME/.bazelrc" || echo "(none - auto-connect off)"
          echo "::endgroup::"
          command -v bazel >/dev/null 2>&1 || sudo npm install -g @bazel/bazelisk >/dev/null 2>&1
          bazel version 2>&1 | head -1
          echo "::group::announce_rc"
          bazel info --announce_rc --remote_timeout=10s 2>&1 \
            | grep -iE "Inherited 'build'|remote_cache|remote_header" \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g'
          echo "::endgroup::"

      - name: Build with INVALID command-line token (the shadowing test)
        run: |
          set +e
          bazel clean >/dev/null 2>&1
          bazel build //:hello \
            --remote_header=authorization=depot_org_INVALIDPLACEHOLDER000 \
            --remote_upload_local_results=true \
            --remote_timeout=20s \
            --disk_cache= 2>&1 | tee build-invalid.log | tail -30
          echo "----- auth/cache signal (INVALID token) -----"
          grep -iE "UNAUTHENTICATED|invalid token|remote cache hit|uploaded|processes:" build-invalid.log \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' || echo "(no auth/cache lines found)"

      - name: Build with VALID org token (control)
        run: |
          set +e
          bazel clean >/dev/null 2>&1
          bazel build //:hello \
            --remote_header=authorization=$DEPOT_TOKEN \
            --remote_upload_local_results=true \
            --remote_timeout=20s \
            --disk_cache= 2>&1 | tee build-valid.log | tail -30
          echo "----- auth/cache signal (VALID org token) -----"
          grep -iE "UNAUTHENTICATED|invalid token|remote cache hit|uploaded|processes:" build-valid.log \
            | sed -E 's/(depot_[a-z0-9]+_)[A-Za-z0-9-]+/\1REDACTED/g' || echo "(no auth/cache lines found)"
