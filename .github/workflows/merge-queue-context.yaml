# DEP-5695 verification. Same dump as .depot/workflows/merge-queue-context.yaml but on a
# GitHub-hosted runner, so GitHub's own values for base_ref, head_ref, and base_sha can be
# read off a real merge group rather than inferred from docs.
name: Merge Queue Context (GitHub)
on:
  merge_group:
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      # Values are bracketed so an empty string is visible in the log.
      - name: Dump merge_group context
        run: |
          echo "side=github-hosted"
          echo "event_name=[${{ github.event_name }}]"
          echo "ref=[${{ github.ref }}]"
          echo "sha=[${{ github.sha }}]"
          echo "base_ref=[${{ github.base_ref }}]"
          echo "head_ref=[${{ github.head_ref }}]"
          echo "mg_base_sha=[${{ github.event.merge_group.base_sha }}]"
          echo "mg_head_sha=[${{ github.event.merge_group.head_sha }}]"
          echo "mg_base_ref=[${{ github.event.merge_group.base_ref }}]"
          echo "mg_head_commit_message=[${{ github.event.merge_group.head_commit.message }}]"
