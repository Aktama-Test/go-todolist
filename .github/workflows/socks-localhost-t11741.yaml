name: SOCKS proxy .localhost bypass repro (T-11741)

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the agentd DNS helper
        working-directory: dep6542
        run: |
          go test ./...
          CGO_ENABLED=0 go build -o /tmp/dep6542-dns .
      - name: Identify runner and prepare registry
        run: |
          set -euxo pipefail
          cat /sys/class/dmi/id/product_name
          token=$(curl -fsS --max-time 3 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token || true)
          if [ -n "$token" ]; then
            echo 'EC2 runner; rerun to validate Metal'
            exit 1
          fi
          sudo tailscale status --json | jq -r '.Self.DNSName' > /tmp/tailnet-dns-name
          sudo tailscale status --json | jq -r '.Self.TailscaleIPs[] | select(contains(":") | not)' > /tmp/tailnet-ip
          getent ahostsv4 "$(cat /tmp/tailnet-dns-name)"
          cat /etc/resolv.conf
          sudo cat /etc/docker/daemon.json
          sudo jq -e '.proxies["http-proxy"] == "socks5://127.0.0.1:982" and .proxies["https-proxy"] == "socks5://127.0.0.1:982"' /etc/docker/daemon.json
          docker pull registry:2
          docker pull alpine:3.20
          sudo jq '.["insecure-registries"] = ["localhost:5000", "k3d-registry.localhost:5000"] | del(.proxies["no-proxy"])' /etc/docker/daemon.json > /tmp/daemon-baseline.json
          sudo cp /tmp/daemon-baseline.json /etc/docker/daemon.json
          sudo systemctl reset-failed docker.service
          sudo systemctl restart docker
          docker run -d --name dep6542-registry -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ && break; sleep 1; done
          docker tag alpine:3.20 localhost:5000/alpine:dep6542
          docker tag alpine:3.20 k3d-registry.localhost:5000/alpine:dep6542

      - name: Configure public DNS without a hosts workaround
        run: |
          set -euxo pipefail
          sudo tailscale set --accept-dns=false
          sudo unlink /etc/resolv.conf || sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n' | sudo tee /etc/resolv.conf
          sleep 6 # Allow Go to reload resolv.conf after the DNS change.
          cat /etc/resolv.conf
          if grep -F k3d-registry.localhost /etc/hosts; then exit 1; fi
          dig +time=3 +tries=1 registry-1.docker.io
          dig +time=3 +tries=1 k3d-registry.localhost
          getent hosts k3d-registry.localhost || true
          docker push localhost:5000/alpine:dep6542

      - name: Confirm baseline failure
        run: |
          set +e
          set -uo pipefail
          timeout 90 docker push k3d-registry.localhost:5000/alpine:dep6542 2>&1 | tee /tmp/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          echo "baseline_exit=$result"
          test "$result" -ne 0
          grep -E 'socks connect|host unreachable' /tmp/baseline.log

      - name: Start Tailscale against plain DNS before the helper
        run: |
          set -euxo pipefail
          sudo tailscale down
          sudo systemctl restart tailscaled
          systemctl show tailscaled -p MainPID --value > /tmp/tailscaled-before
          test "$(cat /tmp/tailscaled-before)" -gt 0
          test ! -L /etc/resolv.conf
          cat /etc/resolv.conf

      - name: Route host DNS through systemd-resolved
        id: resolver
        run: |
          set -euxo pipefail
          cp /etc/resolv.conf /tmp/resolv-before
          mkdir /tmp/dep6542-fail
          printf '#!/bin/sh\nexit 47\n' > /tmp/dep6542-fail/systemctl
          chmod +x /tmp/dep6542-fail/systemctl
          if sudo env PATH="/tmp/dep6542-fail:$PATH" /tmp/dep6542-dns; then
            echo 'Expected the failed service startup to return an error'
            exit 1
          fi
          cmp /etc/resolv.conf /tmp/resolv-before
          test ! -L /etc/resolv.conf
          sudo /tmp/dep6542-dns
          # A repeated invocation must preserve the working managed symlink.
          sudo /tmp/dep6542-dns
          sudo cat /run/systemd/resolved.conf.d/agentd.conf
          sleep 6
          readlink -f /etc/resolv.conf
          cat /etc/resolv.conf
          resolvectl status
          dig @127.0.0.53 +short k3d-registry.localhost A | grep -x 127.0.0.1
          dig @127.0.0.53 +short k3d-registry.localhost AAAA | grep -x ::1
          getent ahostsv4 k3d-registry.localhost
          if grep -F k3d-registry.localhost /etc/hosts; then exit 1; fi
          getent ahostsv4 registry-1.docker.io

      - name: Push with resolved and existing SOCKS configuration
        run: |
          set -euxo pipefail
          sudo jq -e '.proxies["no-proxy"] == null' /etc/docker/daemon.json
          timeout 90 docker push k3d-registry.localhost:5000/alpine:dep6542
          docker pull busybox:1.37

      - name: Bring up the existing Tailscale daemon and verify integration
        if: ${{ !cancelled() && steps.resolver.outcome == 'success' }}
        run: |
          set -euxo pipefail
          sudo jq -e '.proxies["no-proxy"] == null and .proxies["http-proxy"] == "socks5://127.0.0.1:982" and .proxies["https-proxy"] == "socks5://127.0.0.1:982"' /etc/docker/daemon.json
          docker info --format '{{json .}}' | jq '{HttpProxy, HttpsProxy, NoProxy}'
          sudo systemctl enable --now tailscaled
          sudo tailscale up
          sudo tailscale set --accept-dns=true
          test "$(systemctl show tailscaled -p MainPID --value)" = "$(cat /tmp/tailscaled-before)"
          sleep 6
          readlink -f /etc/resolv.conf
          cat /etc/resolv.conf
          resolvectl status
          if test -L /etc/resolv.conf; then
            echo 'RESULT: resolver symlink preserved'
          else
            echo 'RESULT: Tailscale replaced resolver symlink with a regular file'
          fi
          getent ahostsv4 "$(cat /tmp/tailnet-dns-name)" | tee /tmp/tailnet-lookup
          grep -F "$(cat /tmp/tailnet-ip)" /tmp/tailnet-lookup
          getent ahostsv4 registry-1.docker.io
          if grep -F k3d-registry.localhost /etc/hosts; then exit 1; fi
          timeout 90 docker push k3d-registry.localhost:5000/alpine:dep6542
          docker pull busybox:1.37

      - name: Diagnostics
        if: always()
        run: |
          sudo journalctl -u docker -u agentd -u systemd-resolved --since '-10 min' --no-pager | tail -100
