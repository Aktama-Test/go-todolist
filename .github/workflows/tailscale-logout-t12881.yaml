name: Tailscale logout repro (T-12881)

on:
  workflow_dispatch:

jobs:
  tailnet-node:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Show tailnet node
        run: |
          for i in $(seq 1 12); do
            sudo tailscale status --self --peers=false && break
            sleep 5
          done
          echo "runner hostname: $(hostname)"
      - name: Hold the node online
        run: sleep 60
