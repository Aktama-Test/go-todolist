name: SOCKS proxy .localhost fix verification (T-11741)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Recon
        run: |
          curl -s --max-time 2 http://169.254.169.254/latest/meta-data/instance-type \
            && echo "  <- EC2" || echo "no IMDS, so Metal"
          echo "## agentd"; sudo journalctl -u agentd -o cat --no-pager | grep -m1 -i 'version' || true
          echo "## resolv.conf"; cat /etc/resolv.conf
          echo "## nsswitch hosts"; grep '^hosts:' /etc/nsswitch.conf
          echo "## hosts"; cat /etc/hosts
          echo "## daemon.json as shipped"; sudo cat /etc/docker/daemon.json; echo
          echo "## docker info"; docker info 2>/dev/null | grep -iE 'proxy|Server Version'

      - name: Pin resolv.conf to 8.8.8.8 like the customer's runners
        run: |
          set -euxo pipefail
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf
          sudo chattr +i /etc/resolv.conf
          sleep 6
          cat /etc/resolv.conf
          getent hosts k3d-registry.localhost || echo "glibc: not found, exit=$?"

      - name: Registry, with plain HTTP allowed and the shipped proxies block kept
        run: |
          set -euxo pipefail
          sudo jq '.["insecure-registries"] = ["k3d-registry.localhost:5000"]' /etc/docker/daemon.json | sudo tee /tmp/shipped.json >/dev/null
          sudo cp /tmp/shipped.json /etc/docker/daemon.json
          sudo systemctl restart docker; sleep 10
          docker run -d --name reg -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          docker pull alpine:3.20
          docker tag alpine:3.20 k3d-registry.localhost:5000/alpine:t11741

      - name: A. Shipped config, 8.8.8.8, no hosts entry
        run: |
          set +e
          cat /etc/resolv.conf; grep k3d-registry /etc/hosts || echo "no hosts entry"
          docker info | grep -i proxy
          time docker push k3d-registry.localhost:5000/alpine:t11741 2>&1 | tail -2
          echo "exit=${PIPESTATUS[0]}"

      - name: B. Add no-proxy localhost as v1.93.4 writes it, 8.8.8.8, no hosts entry
        run: |
          set +e
          sudo jq '.proxies["no-proxy"] = "localhost"' /tmp/shipped.json | sudo tee /tmp/fix.json >/dev/null
          sudo cp /tmp/fix.json /etc/docker/daemon.json
          sudo systemctl restart docker; sleep 10
          docker start reg; for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          cat /etc/resolv.conf; grep k3d-registry /etc/hosts || echo "no hosts entry"
          docker info | grep -i proxy
          time docker push k3d-registry.localhost:5000/alpine:t11741 2>&1 | tail -2
          echo "exit=${PIPESTATUS[0]}"

      - name: C. Same config, plus the hosts entry workaround
        run: |
          set +e
          echo '127.0.0.1 k3d-registry.localhost' | sudo tee -a /etc/hosts
          sleep 6
          docker push k3d-registry.localhost:5000/alpine:t11741 2>&1 | tail -2
          echo "exit=${PIPESTATUS[0]}"

      - name: agentd log lines for the name
        if: always()
        run: sudo journalctl -u agentd -o cat --no-pager --since '-10min' | grep -i 'k3d-registry' | tail -8 | cut -c1-300
