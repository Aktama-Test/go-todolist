name: SOCKS proxy .localhost fix verification (T-11741)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    steps:
      - name: Recon
        run: |
          curl -s --max-time 2 http://169.254.169.254/latest/meta-data/instance-type \
            && echo "  <- EC2" || echo "no IMDS, so Metal"
          echo "## agentd"; sudo journalctl -u agentd -o cat --no-pager | grep -m1 -i 'version' || true
          echo "## resolv.conf"; ls -l /etc/resolv.conf; cat /etc/resolv.conf
          echo "## nsswitch hosts"; grep '^hosts:' /etc/nsswitch.conf
          echo "## hosts"; cat /etc/hosts
          echo "## daemon.json as shipped"; sudo cat /etc/docker/daemon.json
          echo "## docker info"; docker info 2>/dev/null | grep -iE 'proxy|Server Version'

      - name: Allow plain HTTP to the test registry, keep the shipped proxies block
        run: |
          set -euxo pipefail
          sudo jq '.["insecure-registries"] = ["k3d-registry.localhost:5000"]' /etc/docker/daemon.json | sudo tee /tmp/d.json >/dev/null
          sudo cp /tmp/d.json /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 10
          docker info | grep -i proxy

      - name: Start registry
        run: |
          set -euxo pipefail
          docker run -d --name reg -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          docker pull alpine:3.20
          docker tag alpine:3.20 k3d-registry.localhost:5000/alpine:t11741

      - name: Push with the shipped config and this org's resolver, no hosts entry
        run: |
          set +e
          grep k3d-registry /etc/hosts || echo "no hosts entry"
          docker push k3d-registry.localhost:5000/alpine:t11741 2>&1 | tail -3
          echo "exit=${PIPESTATUS[0]}"

      - name: Point resolv.conf at 8.8.8.8 like the customer's runners
        run: |
          set -euxo pipefail
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf
          sleep 6
          cat /etc/resolv.conf
          set +e
          echo "## control: the SOCKS path, which is the customer's pre-fix failure"
          curl -sS --max-time 45 --socks5-hostname 127.0.0.1:982 http://k3d-registry.localhost:5000/v2/; echo "curl exit=$?"
          echo "## glibc view"; getent hosts k3d-registry.localhost; echo "getent exit=$?"

      - name: Push with the shipped config and 8.8.8.8, no hosts entry
        run: |
          set +e
          cat /etc/resolv.conf
          grep k3d-registry /etc/hosts || echo "no hosts entry"
          docker push k3d-registry.localhost:5000/alpine:t11741 2>&1 | tail -3
          echo "exit=${PIPESTATUS[0]}"
          echo "## agentd log lines for the name"
          sudo journalctl -u agentd -o cat --no-pager --since '-3min' | grep -i 'k3d-registry' | tail -5
