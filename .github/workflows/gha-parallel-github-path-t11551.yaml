name: GHA runner parallel $GITHUB_PATH race repro (T-11551)

on:
  workflow_dispatch:

jobs:
  race:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Record the pre-block PATH
        run: echo "PATH-BEFORE=$PATH"

      # Three composite actions running concurrently, each alternating
      # $GITHUB_PATH writes with plain steps. Mirrors the pnpm-install /
      # setup-python-cached / rust-toolchain shape that failed for PostHog.
      - parallel:
          - name: Churn A
            uses: ./.github/actions/path-churn
            with:
              tag: ca
          - name: Churn B
            uses: ./.github/actions/path-churn
            with:
              tag: cb
          - name: Churn C
            uses: ./.github/actions/path-churn
            with:
              tag: cc

      - name: After the block
        if: always()
        run: |
          echo "PATH-AFTER-COUNT=$(tr ':' '\n' <<< "$PATH" | grep -c '/c[abc]-' || true)"
          for t in ca cb cc; do
            echo "$t=$(tr ':' '\n' <<< "$PATH" | grep -c "/$t-" || true)"
          done
