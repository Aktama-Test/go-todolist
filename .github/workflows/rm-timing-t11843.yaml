name: Toolchain rm timing repro (T-11843)
on:
  workflow_dispatch:
jobs:
  time-rm:
    strategy:
      fail-fast: false
      matrix:
        idx: [1, 2, 3, 4, 5, 6]
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Host info
        run: |
          echo "kernel=$(uname -r)"
          echo "dmi=$(sudo cat /sys/class/dmi/id/sys_vendor 2>/dev/null) / $(sudo cat /sys/class/dmi/id/product_name 2>/dev/null)"
          echo "root=$(findmnt -no SOURCE,FSTYPE,SIZE /)"
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
      - name: Time rm of toolchain dirs
        run: |
          s=$(date +%s%N)
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /usr/share/swift /opt/hostedtoolcache/CodeQL
          e=$(date +%s%N)
          echo "rm_ms=$(( (e - s) / 1000000 ))"
